<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>CANView 320×480 UI prototype</title>
  <link rel="stylesheet" href="canview.css">
</head>
<body>
  <main class="app" aria-label="CANView 화면 프로토타입">
    <header class="status-bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>CANVIEW <span class="prototype-tag">PROTO</span></div>
      <div class="link-summary" role="status" aria-label="연결 상태">
        <span>BUS 3/3</span>
        <span class="link-state">연결 · −54 dBm</span>
      </div>
    </header>

    <div class="screen-stack">
      <section class="screen-panel drive-panel is-active" id="screen-drive" data-screen="drive" aria-label="주행 상태">
        <div class="gauge-cluster">
          <div class="gauge" role="img" aria-label="차속 시속 82킬로미터">
            <svg class="gauge-ring" viewBox="0 0 140 140" aria-hidden="true">
              <circle class="gauge-track" cx="70" cy="70" r="58" pathLength="100"/>
              <circle class="gauge-progress" cx="70" cy="70" r="58" pathLength="100" style="--gauge-progress: 25.5"/>
            </svg>
            <div class="gauge-readout"><span class="micro-label">Speed</span><strong data-speed-value>82</strong><span class="gauge-unit" data-speed-unit>km/h</span></div>
          </div>
          <div class="gauge" role="img" aria-label="엔진 회전수 1840 rpm">
            <svg class="gauge-ring" viewBox="0 0 140 140" aria-hidden="true">
              <circle class="gauge-track" cx="70" cy="70" r="58" pathLength="100"/>
              <circle class="gauge-progress" cx="70" cy="70" r="58" pathLength="100" style="--gauge-progress: 21"/>
            </svg>
            <div class="gauge-readout gauge-readout--rpm"><span class="micro-label">RPM</span><strong>1.8</strong><span class="gauge-unit">×1000</span></div>
          </div>
        </div>

        <div class="status-row">
          <div class="status-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 15h14M7 15l1-6h8l1 6M8 18h.01M16 18h.01"/><path d="M10 6h4M12 4v4"/></svg>
          </div>
          <strong>DPF 정상</strong>
        </div>

        <div class="mini-grid">
          <article class="mini-readout"><span class="micro-label">Drive mode</span><strong>NORMAL</strong></article>
          <article class="mini-readout"><span class="micro-label">4WD</span><div class="inline-values"><strong>38%</strong><span>126 Nm</span></div></article>
        </div>
      </section>

      <section class="screen-panel audio-panel" id="screen-audio" data-screen="audio" aria-label="오디오 기능" hidden>
        <div class="quick-modes">
          <button class="mode-button" type="button" data-profile="quiet" aria-pressed="false">
            <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h3l4 4V7L7 11H4Z"/><path d="m16 9 5 5m0-5-5 5"/></svg></span><strong>취침</strong>
          </button>
          <button class="mode-button" type="button" data-profile="rear" aria-pressed="true">
            <span class="mode-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h3l4 4V7L7 11H4Z"/><path d="M15 9c1.5 1.5 1.5 4.5 0 6M18 7c3 3 3 7 0 10"/></svg></span><strong>뒷좌석 +</strong>
          </button>
        </div>

        <div class="volume-card">
          <div class="volume-readout"><span class="micro-label">Volume</span><strong data-volume-value>18</strong></div>
          <div class="volume-stepper" role="group" aria-label="음량 조절">
            <button class="step-button" type="button" data-volume-step="-1" aria-label="음량 낮추기">−</button>
            <button class="step-button" type="button" data-volume-step="1" aria-label="음량 높이기">+</button>
          </div>
        </div>

        <div class="adaptive-card">
          <div class="adaptive-copy"><strong>주행 소음 보정</strong><span>+2</span></div>
          <button class="adaptive-toggle" type="button" aria-pressed="true">사용</button>
        </div>
      </section>

      <section class="screen-panel fft-panel" id="screen-fft" data-screen="fft" aria-label="소리 FFT 분석" hidden>
        <div class="compact-gauges">
          <div class="compact-gauge" role="img" aria-label="차속 시속 82킬로미터">
            <svg viewBox="0 0 112 112" aria-hidden="true"><circle class="gauge-track" cx="56" cy="56" r="45" pathLength="100"/><circle class="gauge-progress" cx="56" cy="56" r="45" pathLength="100" style="--gauge-progress: 25.5"/></svg>
            <div><span data-speed-unit>km/h</span><strong data-speed-value>82</strong></div>
          </div>
          <div class="compact-gauge" role="img" aria-label="엔진 회전수 1840 rpm">
            <svg viewBox="0 0 112 112" aria-hidden="true"><circle class="gauge-track" cx="56" cy="56" r="45" pathLength="100"/><circle class="gauge-progress" cx="56" cy="56" r="45" pathLength="100" style="--gauge-progress: 21"/></svg>
            <div><span>×1000 rpm</span><strong>1.8</strong></div>
          </div>
        </div>

        <div class="spectrum-card">
          <div class="spectrum-head"><span class="micro-label">Cabin FFT</span><span>LIVE</span></div>
          <svg class="spectrum-chart" viewBox="0 0 276 96" role="img" aria-label="실내 소음 주파수 스펙트럼, 1.25킬로헤르츠에서 최대 68데시벨">
            <path class="spectrum-grid" d="M0 18.5H276M0 48.5H276M0 78.5H276"/>
            <g class="spectrum-bars">
              <rect x="3" y="54" width="7" height="30"/><rect x="15" y="43" width="7" height="41"/><rect x="27" y="38" width="7" height="46"/><rect x="39" y="48" width="7" height="36"/><rect x="51" y="57" width="7" height="27"/><rect x="63" y="61" width="7" height="23"/><rect x="75" y="50" width="7" height="34"/><rect x="87" y="35" width="7" height="49"/><rect x="99" y="26" width="7" height="58"/><rect x="111" y="10" width="7" height="74" class="is-peak"/><rect x="123" y="22" width="7" height="62"/><rect x="135" y="39" width="7" height="45"/><rect x="147" y="51" width="7" height="33"/><rect x="159" y="45" width="7" height="39"/><rect x="171" y="58" width="7" height="26"/><rect x="183" y="63" width="7" height="21"/><rect x="195" y="56" width="7" height="28"/><rect x="207" y="65" width="7" height="19"/><rect x="219" y="60" width="7" height="24"/><rect x="231" y="68" width="7" height="16"/><rect x="243" y="72" width="7" height="12"/><rect x="255" y="75" width="7" height="9"/><rect x="267" y="78" width="7" height="6"/>
            </g>
            <path class="peak-marker" d="M114.5 4V88"/>
          </svg>
          <div class="spectrum-axis"><span>50 Hz</span><span>1 kHz</span><span>8 kHz</span></div>
        </div>

        <div class="peak-strip">
          <div><span>PEAK</span><strong>1.25 kHz</strong></div>
          <div><span>LEVEL</span><strong>68 dB</strong></div>
        </div>
      </section>

      <section class="screen-panel automation-panel" id="screen-automation" data-screen="automation" aria-label="SPORT 자동화" hidden>
        <div class="sport-card">
          <div class="sport-heading"><span class="micro-label">Sport automation</span><h1>SPORT 자동</h1></div>
          <div class="mode-dial" role="img" aria-label="현재 주행 모드 노멀"><div><span>현재 모드</span><strong>NORMAL</strong></div></div>
          <button class="sport-toggle" type="button" aria-pressed="true">사용</button>
        </div>
      </section>

      <section class="screen-panel settings-panel" id="screen-settings" data-screen="settings" aria-label="설정" hidden>
        <div class="brightness-card">
          <div class="setting-heading"><span class="micro-label">Display</span><strong>화면 밝기</strong></div>
          <output class="brightness-value" for="brightness">42%</output>
          <input id="brightness" class="brightness-slider" type="range" min="10" max="100" value="42" aria-label="화면 밝기">
        </div>
        <div class="setting-row">
          <div><span class="micro-label">Sensor</span><strong>자동 밝기</strong></div>
          <button class="setting-toggle" type="button" aria-pressed="false">끔</button>
        </div>
        <div class="unit-card">
          <div><span class="micro-label">Units</span><strong>속도 단위</strong></div>
          <div class="unit-options" role="group" aria-label="속도 단위">
            <button type="button" data-unit="metric" aria-pressed="true">km/h</button>
            <button type="button" data-unit="imperial" aria-pressed="false">mph</button>
          </div>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="주요 화면" role="tablist">
      <button class="nav-button" type="button" role="tab" aria-selected="true" aria-controls="screen-drive" data-target="drive"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15h14M7 15l1-6h8l1 6M6 15v3m12-3v3M8 18h.01M16 18h.01"/></svg></span><span>주행</span></button>
      <button class="nav-button" type="button" role="tab" aria-selected="false" aria-controls="screen-audio" data-target="audio"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h3l4 4V7L7 11H4Z"/><path d="M15 9c1.5 1.5 1.5 4.5 0 6M18 7c3 3 3 7 0 10"/></svg></span><span>소리</span></button>
      <button class="nav-button" type="button" role="tab" aria-selected="false" aria-controls="screen-fft" data-target="fft"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h3l2-6 3 12 3-9 2 6h5"/></svg></span><span>FFT</span></button>
      <button class="nav-button" type="button" role="tab" aria-selected="false" aria-controls="screen-automation" data-target="automation"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M6 6l2 2m8 8 2 2M18 6l-2 2M8 16l-2 2"/><circle cx="12" cy="12" r="4"/></svg></span><span>자동</span></button>
      <button class="nav-button" type="button" role="tab" aria-selected="false" aria-controls="screen-settings" data-target="settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1A8 8 0 0 0 15 6l-.3-2.6h-4L10.4 6A8 8 0 0 0 8 7.1l-2.4-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1A8 8 0 0 0 10.4 18l.3 2.6h4L15 18a8 8 0 0 0 1.6-1.1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></svg></span><span>설정</span></button>
    </nav>
  </main>
  <script src="prototype.js"></script>
</body>
</html>
