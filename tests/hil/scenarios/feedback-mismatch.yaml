      {"kind": "FEEDBACK_RESULT", "fields": {"case": "result-before-ack", "result": "RESULT_BEFORE_ACK", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "feedback-mismatch", "result": "MISMATCH", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "feedback-timeout", "result": "TIMEOUT", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "manual-override", "result": "MANUAL_OVERRIDE", "tx_permitted": false}},
      {"kind": "FEEDBACK_SEQUENCE", "fields": {"case": "result-before-ack", "sequence": ["RESULT", "ACK"]}}
    ],
    "ordered_events": [
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "feedback-success", "result": "SUCCESS", "tx_permitted": false}},
      {"kind": "FEEDBACK_SEQUENCE", "fields": {"case": "result-before-ack", "sequence": ["RESULT", "ACK"]}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "result-before-ack", "result": "RESULT_BEFORE_ACK", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "feedback-mismatch", "result": "MISMATCH", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "feedback-timeout", "result": "TIMEOUT", "tx_permitted": false}},
      {"kind": "FEEDBACK_RESULT", "fields": {"case": "manual-override", "result": "MANUAL_OVERRIDE", "tx_permitted": false}},
      {"kind": "TX_GATE_STATE", "fields": {"vehicle_tx": false, "mode": "CAPTURE_ONLY"}},
      {"kind": "HARNESS_COMPLETE", "fields": {"scenario": "feedback-mismatch", "firmware_mode": "CAPTURE_ONLY"}}
    ]
  }
}
