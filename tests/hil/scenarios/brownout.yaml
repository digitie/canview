{
  "schema_version": 1,
  "id": "brownout",
  "title": "brownout during config capture and command admission",
  "suites": ["host", "g2-readonly"],
  "mode": "CAPTURE_ONLY",
  "actions": [
    {"type": "power", "stages": ["config", "capture", "command"]}
