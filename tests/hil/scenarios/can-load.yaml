{
  "schema_version": 1,
  "id": "can-load",
  "title": "three independent CAN channel load and bus state",
  "suites": ["host", "g2-readonly"],
  "mode": "CAPTURE_ONLY",
  "actions": [
    {"type": "can_load", "channels": [
      {"channel": 1, "rx_frames": 512, "bus_state": "ERROR_ACTIVE"},
      {"channel": 2, "rx_frames": 512, "bus_state": "ERROR_PASSIVE"},
      {"channel": 3, "rx_frames": 512, "bus_state": "BUS_OFF", "error_counter": 255}
    ]}
  ],
  "expect": {
    "required_kinds": ["CAN_CHANNEL_SUMMARY"],
    "minimum_counts": {"CAN_CHANNEL_SUMMARY": 3},
    "required_fields": [
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 1, "bus_state": "ERROR_ACTIVE", "tx_frames": 0}},
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 2, "bus_state": "ERROR_PASSIVE", "tx_frames": 0}},
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 3, "bus_state": "BUS_OFF", "tx_frames": 0, "error_counter": 255}}
    ],
    "ordered_events": [
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 1, "rx_frames": 512, "bus_state": "ERROR_ACTIVE", "tx_frames": 0, "error_counter": 0}},
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 2, "rx_frames": 512, "bus_state": "ERROR_PASSIVE", "tx_frames": 0, "error_counter": 0}},
      {"kind": "CAN_CHANNEL_SUMMARY", "fields": {"channel": 3, "rx_frames": 512, "bus_state": "BUS_OFF", "tx_frames": 0, "error_counter": 255}},
      {"kind": "TX_GATE_STATE", "fields": {"vehicle_tx": false, "mode": "CAPTURE_ONLY"}},
      {"kind": "HARNESS_COMPLETE", "fields": {"scenario": "can-load", "firmware_mode": "CAPTURE_ONLY"}}
    ]
  }
}
